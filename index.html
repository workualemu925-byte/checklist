<script>
const $=i=>document.getElementById(i),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===== የኢትዮጵያ አቆጣጠር (ጳጉሜን 5/6 ቀን ጨምሮ) =====
const g2j=(y,m,d)=>{const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045};
const j2e=j=>{const q=j-1723856,r=q%1461,n=r%365+365*Math.floor(r/1460);return{y:4*Math.floor(q/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30)+1,d:n%30+1}};

['wdisp','የወረዳ/ከተማ ስምሪት',['የስምሪት መርሃ-ግብር','የስምሪት መከታተያ ቼክሊስት','ጊዜያዊ ስምሪት','ቅሬታ አያያዝ']],

const def=()=>({sec:SEED.map(s=>{const w=dist(s[2].length);return{id:s[0],t:s[1],items:s[2].map((t,i)=>({t,w:w[i]})),u:0}}),rec:[],def:[],let:[],usr:[{id:'1',name:'admin',pin:'admin123',role:'admin',area:'',sec:[],u:0}],set:{head:'አማራ ብሔራዊ ክልላዊ መንግሥት መንገድና ትራንስፖርት ቢሮ — ትራንስፖርት አገልግሎት ክትትልና ኢንስፔክሽን ዳይሬክቶሬት',prefix:'ወ/ጠ/ሰ/ሁ/ዞ/ኢ/ስ/ሂ/',pass:85,part:60,stamp:'',url:'',key:'',u:0},del:{}});

function doLogin(){const u=db.usr.find(x=>x.id==$('lu').value);if(u&&u.pin==$('lpin').value){me=u;sessionStorage.me=u.id;$('login').className='modal';start()}else T('❌ የይለፍ ቃል ስህተት')}

function nav(){const t=[['chk','✅ ቸክሊስት'],['rec','📊 መዝገብ'],['trk','⚠️ ክትትል'],['let','📝 ደብዳቤ'],...(me.role=='admin'?[['adm','🛠 አስተዳደር']]:[]),['cld','☁️ ክላውድ']];
